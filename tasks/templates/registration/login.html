{% extends "base.html" %}

{% block title %}Login - TaskFlow{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-xl shadow-md border border-gray-100">
    <h2 class="text-2xl font-bold text-center text-gray-900 mb-6">Welcome Back</h2>
    
    <form method="post" class="space-y-4">
        {% csrf_token %}
        
        {% if form.errors %}
            <div class="bg-red-50 text-red-700 p-3 rounded-lg text-sm mb-4">
                Invalid username or password. Please try again.
            </div>
        {% endif %}

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="id_username">Username</label>
            <input type="text" name="username" id="id_username" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1" for="id_password">Password</label>
            <input type="password" name="password" id="id_password" required
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm">
        </div>

        <button type="submit" 
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-lg shadow transition duration-150 ease-in-out cursor-pointer mt-2">
            Log In
        </button>
    </form>

    <p class="mt-6 text-center text-sm text-gray-600">
        Don't have an account? 
        <a href="{% url 'register' %}" class="text-indigo-600 hover:text-indigo-800 font-medium">Register here</a>
    </p>
</div>
{% endblock %}
