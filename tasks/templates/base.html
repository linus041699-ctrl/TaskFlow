<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}TaskFlow{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 antialiased min-h-screen">
    <nav class="bg-indigo-600 text-white p-4 shadow-md">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <a href="/" class="text-xl font-bold tracking-wide">TaskFlow</a>
            <div class="flex items-center space-x-4">
                {% if user.is_authenticated %}
                    <span class="text-indigo-200">Hello, <strong>{{ user.username }}</strong></span>
                    <!-- Django 5 POST Form Logout -->
                    <form action="{% url 'logout' %}" method="post" class="inline">
                        {% csrf_token %}
                        <button type="submit" class="bg-indigo-700 hover:bg-indigo-800 text-white text-sm px-3 py-1.5 rounded transition cursor-pointer">
                            Logout
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="bg-indigo-700 hover:bg-indigo-800 text-white text-sm px-3 py-1.5 rounded transition">
                        Login
                    </a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto p-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
