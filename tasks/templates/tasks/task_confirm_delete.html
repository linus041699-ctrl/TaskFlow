{% extends "base.html" %}

{% block title %}Delete Task - TaskFlow{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-8 rounded-xl shadow-md border border-gray-100 text-center">
    <div class="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4 font-bold text-xl">
        !
    </div>
    <h1 class="text-xl font-bold text-gray-900 mb-2">Delete Task</h1>
    <p class="text-gray-600 text-sm mb-6">Are you sure you want to delete "<strong class="text-gray-900">{{ task.title }}</strong>"? This action cannot be undone.</p>

    <form method="post" class="flex justify-center space-x-3">
        {% csrf_token %}
        <a href="{% url 'task_list' %}" class="bg-gray-100 hover:bg-gray-200 text-gray-700 font-medium py-2 px-4 rounded-lg transition">
            Cancel
        </a>
        <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-4 rounded-lg shadow transition cursor-pointer">
            Yes, Delete
        </button>
    </form>
</div>
{% endblock %}
